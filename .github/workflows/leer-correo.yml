name: Leer respuesta M3U de GMX

on:
  workflow_dispatch:
    inputs:
      used_email:
        description: "Correo utilizado en la solicitud"
        required: true
        type: string

permissions:
  contents: write

env:
  WAIT_TIMEOUT: "300"
  WAIT_INTERVAL: "20"

jobs:
  leer-correo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar lector de correo
        env:
          GMX_USER: ${{ secrets.GMX_USER }}
          GMX_PASS: ${{ secrets.GMX_PASS }}
          USED_EMAIL: ${{ github.event.inputs.used_email }}
        run: python run.py

      - name: Guardar resultado y correos usados en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add result.json emails.json
          if git diff --cached --quiet; then
            echo "No hay cambios que confirmar."
          else
            git commit -m "Actualizar resultado del correo M3U"
            git push
          fi

      - name: Guardar resultado como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: resultado-correo-m3u
          path: result.json
          if-no-files-found: error
          retention-days: 1
