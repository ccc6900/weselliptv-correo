name: Flujo completo - Enviar y leer M3U

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  WAIT_TIMEOUT: "300"
  WAIT_INTERVAL: "20"

jobs:
  full-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias Node
        run: npm install

      - name: Instalar navegador Chromium
        run: npx playwright install --with-deps chromium

      - name: Enviar correo con Playwright
        run: node send-email.js

      - name: Leer respuesta de GMX
        env:
          GMX_USER: ${{ secrets.GMX_USER }}
          GMX_PASS: ${{ secrets.GMX_PASS }}
        run: python run.py

      - name: Guardar cambios en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add result.json emails.json
          if git diff --cached --quiet; then
            echo "No hay cambios que confirmar."
          else
            git commit -m "Flujo completo: enviar correo y leer M3U"
            git push
          fi

      - name: Guardar artefactos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flujo-completo-resultado
          path: |
            result.json
            send-result.png
            send-error.png
          retention-days: 7
          if-no-files-found: warn
