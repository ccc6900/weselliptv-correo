name: Test - Swoop TV (Ver Formulario)

on:
  workflow_dispatch:

jobs:
  test-swoop:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Instalar navegador Chromium
        run: npx playwright install --with-deps chromium

      - name: Ejecutar prueba de Swoop TV
        run: node test-swoop.js

      - name: Guardar capturas
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swoop-test-resultado
          path: |
            swoop-register.png
            swoop-error.png
          retention-days: 7
          if-no-files-found: warn
