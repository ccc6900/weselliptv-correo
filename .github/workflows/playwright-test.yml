name: Prueba Playwright - WeSellIPTV

on:
  workflow_dispatch:

jobs:
  test-page:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm install

      - name: Instalar navegador Chromium
        run: npx playwright install --with-deps chromium

      - name: Ejecutar prueba de página
        run: node test-page.js

      - name: Guardar captura y HTML como artefacto
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-test-resultado
          path: |
            page-screenshot.png
            page-content.html
          retention-days: 7
          if-no-files-found: warn
