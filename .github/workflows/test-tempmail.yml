name: Test - Correos Temporales (mail.tm)

on:
  workflow_dispatch:

jobs:
  test-tempmail:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Instalar navegador Chromium
        run: npx playwright install --with-deps chromium

      - name: Ejecutar prueba de correo temporal
        run: node test-tempmail.js

      - name: Guardar capturas
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tempmail-test-resultado
          path: tempmail-result.png
          retention-days: 7
          if-no-files-found: warn
