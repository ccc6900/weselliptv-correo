<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor IPTV Automático</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .card { background-color: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 100%; max-width: 500px; }
        h2 { margin-top: 0; color: #38bdf8; text-align: center; }
        p { color: #94a3b8; font-size: 14px; text-align: center; margin-bottom: 20px; }
        button { background-color: #0284c7; color: white; border: none; padding: 14px 20px; font-size: 16px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; transition: background 0.2s; }
        button:hover { background-color: #0369a1; }
        button:disabled { background-color: #334155; cursor: not-allowed; }
        .field { margin-bottom: 15px; text-align: left; }
        .field label { font-size: 12px; color: #94a3b8; display: block; margin-bottom: 4px; }
        .field input { width: 100%; padding: 8px 10px; background: #0f172a; border: 1px solid #475569; color: #fff; border-radius: 4px; font-size: 12px; box-sizing: border-box; }
        #status { margin-top: 15px; font-size: 14px; color: #cbd5e1; min-height: 20px; text-align: center; }
        .result-box { margin-top: 25px; background: #0f172a; padding: 18px; border-radius: 8px; text-align: left; display: none; border: 1px solid #334155; }
        .result-box h3 { margin-top: 0; font-size: 16px; color: #4ade80; text-align: center; }
        .email-list { margin-top: 20px; font-size: 12px; color: #94a3b8; max-height: 200px; overflow-y: auto; }
        .email-item { padding: 4px 0; border-bottom: 1px solid #334155; }
        .email-item.usado { color: #4ade80; text-decoration: line-through; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Gestor IPTV Automático</h2>
        <p>Introduce tu token de GitHub para iniciar el proceso.</p>
        
        <div class="field">
            <label>GitHub Personal Access Token (ghp_...):</label>
            <input type="password" id="inputToken" placeholder="Pega aquí tu token seguro...">
        </div>

        <button id="btnGenerar" onclick="lanzarGeneracion()">Generar Prueba IPTV</button>
        <div id="status"></div>

        <div id="resultadoBox" class="result-box">
            <h3>¡Proceso Completado!</h3>
            <div class="field">
                <label>Correo utilizado:</label>
                <input type="text" id="resCorreo" readonly>
            </div>
            <div class="field">
                <label>Usuario IPTV:</label>
                <input type="text" id="resUsuario" readonly onclick="this.select()">
            </div>
            <div class="field">
                <label>Contraseña IPTV:</label>
                <input type="text" id="resPassword" readonly onclick="this.select()">
            </div>
            <div class="field">
                <label>Host / URL:</label>
                <input type="text" id="resHost" readonly onclick="this.select()">
            </div>
            <div class="field">
                <label>Enlace M3U (si disponible):</label>
                <input type="text" id="resM3u" readonly onclick="this.select()">
            </div>
        </div>

        <div class="email-list" id="emailListContainer">
            <!-- Aquí se cargarán los correos -->
        </div>
    </div>

    <script>
        // ⚠️ CONFIGURACIÓN: CAMBIA ESTO CON TUS DATOS
        const GITHUB_USER = "TU_USUARIO"; 
        const REPO_NAME = "weselliptv-correo";
        const WORKFLOW_FILE = "full-flow.yml"; // Nombre exacto del archivo en .github/workflows/
        const BRANCH = "main";

        window.addEventListener('DOMContentLoaded', () => {
            const savedToken = localStorage.getItem("github_token");
            if (savedToken) document.getElementById("inputToken").value = savedToken;
            cargarListaCorreos();
        });

        async function cargarListaCorreos() {
            try {
                const res = await fetch('emails.json?_=' + new Date().getTime());
                if (res.ok) {
                    const emails = await res.json();
                    const container = document.getElementById("emailListContainer");
                    container.innerHTML = "<strong>Estado de los correos:</strong>";
                    emails.forEach(item => {
                        const div = document.createElement("div");
                        div.className = "email-item " + (item.status === 'usado' ? 'usado' : '');
                        div.textContent = `${item.email} (${item.status})`;
                        container.appendChild(div);
                    });
                }
            } catch(e) {}
        }

        async function lanzarGeneracion() {
            const tokenInput = document.getElementById("inputToken").value.trim();

            if (!tokenInput) {
                alert("Por favor, introduce tu Token de GitHub en la casilla.");
                return;
            }

            localStorage.setItem("github_token", tokenInput);

            const btn = document.getElementById("btnGenerar");
            const status = document.getElementById("status");
            const box = document.getElementById("resultadoBox");

            btn.disabled = true;
            box.style.display = "none";
            status.innerHTML = "🚀 Enviando orden a GitHub Actions...";

            const url = `https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/actions/workflows/${WORKFLOW_FILE}/dispatches`;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${tokenInput}`,
                        'Accept': 'application/vnd.github+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ ref: BRANCH })
                });

                if (response.ok) {
                    status.innerHTML = "⏳ Proceso en marcha... Esperando datos (aprox. 1-2 minutos)...";
                    monitorearResultado();
                } else if (response.status === 401) {
                    status.innerHTML = "❌ Error 401: Token inválido o revocado.";
                    btn.disabled = false;
                } else if (response.status === 404) {
                    status.innerHTML = "❌ Error 404: No se encuentra el repositorio o el workflow. Revisa la configuración.";
                    btn.disabled = false;
                } else {
                    status.innerHTML = "❌ Error al iniciar. Código: " + response.status;
                    btn.disabled = false;
                }
            } catch (err) {
                status.innerHTML = "❌ Error de conexión: " + err.message;
                btn.disabled = false;
            }
        }

        function monitorearResultado() {
            const intervalo = setInterval(async () => {
                try {
                    const res = await fetch('result.json?_=' + new Date().getTime());
                    if (res.ok) {
                        const data = await res.json();
                        
                        // Comprobamos si el resultado es nuevo (por la fecha o porque tiene estado OK)
                        if (data && data.estado === 'OK') {
                            document.getElementById("resCorreo").value = data.correo_usado || "N/A";
                            document.getElementById("resUsuario").value = data.username || "N/A";
                            document.getElementById("resPassword").value = data.password || "N/A";
                            document.getElementById("resHost").value = data.host_url || "N/A";
                            document.getElementById("resM3u").value = data.m3u_url || "No disponible";

                            document.getElementById("resultadoBox").style.display = "block";
                            document.getElementById("status").innerHTML = "✅ ¡Datos recibidos correctamente!";
                            document.getElementById("btnGenerar").disabled = false;
                            clearInterval(intervalo);
                            cargarListaCorreos(); // Actualizar la lista de correos
                        }
                    }
                } catch (e) {
                    // Esperando respuesta...
                }
            }, 8000);
        }
    </script>
</body>
</html>
