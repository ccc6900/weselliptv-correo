<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestor de pruebas IPTV</title>
  <style>
    :root { color-scheme: dark; --bg:#0f172a; --card:#1e293b; --line:#334155; --text:#e2e8f0; --muted:#94a3b8; --green:#22c55e; --yellow:#eab308; --red:#ef4444; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
    .wrap { max-width:1100px; margin:0 auto; padding:32px 20px 64px; }
    h1 { font-size:28px; margin:0 0 6px; }
    p.lead { color:var(--muted); margin:0 0 28px; }
    .actions { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:28px; }
    button { border:0; border-radius:10px; padding:12px 18px; font-weight:600; cursor:pointer; }
    .primary { background:#2563eb; color:white; }
    .secondary { background:var(--card); color:var(--text); border:1px solid var(--line); }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; }
    .card h3 { margin:0 0 10px; font-size:17px; word-break:break-all; }
    .badge { display:inline-block; padding:4px 10px; border-radius:999px; font-size:12px; font-weight:700; }
    .disponible { background:#164e63; color:#67e8f9; }
    .usado { background:#14532d; color:#86efac; }
    .error { background:#7f1d1d; color:#fecaca; }
    .field { margin:10px 0; }
    .label { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
    .value { word-break:break-all; }
    a { color:#93c5fd; }
    .empty { color:var(--muted); text-align:center; padding:40px; border:1px dashed var(--line); border-radius:14px; }
    .status { margin-top:18px; padding:12px 14px; border-radius:10px; background:var(--card); border:1px solid var(--line); display:none; }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Gestor de pruebas IPTV</h1>
    <p class="lead">El flujo completo se ejecuta en GitHub Actions: Playwright envía el correo y luego se lee la respuesta de GMX.</p>

    <div class="actions">
      <button class="primary" id="next">Preparar siguiente correo</button>
      <button class="secondary" id="reload">Actualizar datos</button>
    </div>

    <div class="status" id="status"></div>
    <section class="grid" id="results"></section>
  </main>

<script>
const statusBox = document.getElementById('status');
const results = document.getElementById('results');

function showStatus(text, isError = false) {
  statusBox.style.display = 'block';
  statusBox.textContent = text;
  statusBox.style.borderColor = isError ? '#ef4444' : '#334155';
}

function field(label, value) {
  if (!value) return '';
  return `<div class="field"><div class="label">${label}</div><div class="value">${value}</div></div>`;
}

function renderEmails(emails, result) {
  results.innerHTML = '';
  if (!emails.length) {
    results.innerHTML = '<div class="empty">No hay correos en emails.json.</div>';
    return;
  }

  emails.forEach(item => {
    const r = item.result || {};
    const card = document.createElement('article');
    card.className = 'card';
    card.innerHTML = `
      <h3>${item.email}</h3>
      <span class="badge ${item.status}">${item.status}</span>
      ${field('Usuario', r.username)}
      ${field('Contraseña', r.password)}
      ${field('Host', r.host_url)}
      ${field('Backup', r.backup_host_url)}
      ${field('M3U', r.m3u_url ? `<a href="${r.m3u_url}" target="_blank" rel="noopener">Abrir M3U</a>` : '')}
      ${field('Fecha de uso', item.used_at ? new Date(item.used_at).toLocaleString('es-ES') : '')}
      ${field('Mensaje', r.mensaje)}
    `;
    results.appendChild(card);
  });

  if (result) {
    showStatus(`Última lectura: ${result.estado}. ${result.mensaje || ''}`);
  }
}

async function loadData() {
  try {
    const [emailsRes, resultRes] = await Promise.all([
      fetch('emails.json'),
      fetch('result.json')
    ]);
    const emails = await emailsRes.json();
    let result = null;
    if (resultRes.ok) result = await resultRes.json();
    renderEmails(emails, result);
  } catch (error) {
    showStatus('No se pudieron cargar emails.json o result.json.', true);
  }
}

document.getElementById('reload').addEventListener('click', loadData);

document.getElementById('next').addEventListener('click', async () => {
  try {
    const response = await fetch('emails.json');
    const emails = await response.json();
    const next = emails.find(item => item.status === 'disponible');
    if (!next) {
      showStatus('No quedan correos disponibles.', true);
      return;
    }
    showStatus(`Siguiente correo: ${next.email}. Ve a GitHub Actions → "Flujo completo - Enviar y leer M3U" → Run workflow. El workflow hará todo automáticamente.`);
  } catch (error) {
    showStatus('No se pudo leer emails.json.', true);
  }
});

loadData();
</script>
</body>
</html>
